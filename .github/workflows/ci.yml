name: CI

on:
  pull_request:
  push:
    branches: [master]

# A branch only needs its newest commit checked, and Actions minutes are
# capped on the organisation's plan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # `node-version-file: mise.toml` rather than the version inline, so the pin has one
      # source. @main rather than a release tag because that file format is merged but
      # unreleased; move to the tag once it ships.
      - uses: actions/setup-node@main
        with:
          node-version-file: mise.toml
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run check

      # There is no test step because this package has no tests. Add one here
      # the day it gets a `test` script.
      - name: Build
        run: npm run build
